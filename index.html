<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Enterprise | Precision Matrix & Safety</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           [SYSTEM LAYER 1] ENTERPRISE DESIGN VARIABLES (企業級核心變數)
           ========================================================================== */
        :root {
            /* 性能電光綠 (Supernova Green) */
            --primary: #32d74b;       
            --primary-rgb: 50, 215, 75;
            --accent: #00ff88;
            
            /* 宇宙深淵背景層次 */
            --bg-base: #010204;
            --bg-panel: rgba(14, 16, 20, 0.85);
            --bg-elevated: rgba(26, 28, 34, 0.98);
            
            /* 工業級 LED 狀態指示色 */
            --led-main: #ffffff;      
            --led-on: #32d74b;        
            --led-alert: #ff3b30;     
            --led-warn: #ffd60a;      
            --led-off: #3a3a3c;       
            
            /* 文字層級與發光陰影 */
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.65);
            --text-muted: #8e8e93;
            
            --border-dim: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(var(--primary-rgb), 0.4);
            
            --radius-xl: 32px; --radius-lg: 20px; --radius-md: 10px;
            --shadow-float: 0 15px 45px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 25px rgba(var(--primary-rgb), 0.3);
            
            --font-ui: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-data: "JetBrains Mono", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--font-ui); background: var(--bg-base); color: var(--text-main); width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        /* 渲染層：三芒星呼吸矩陣背景與宇宙光暈 */
        #matrix-canvas { position: fixed; inset: 0; z-index: -2; opacity: 0.88; pointer-events: none; }
        #glow-canvas { position: fixed; inset: 0; z-index: -3; filter: blur(140px); opacity: 0.25; pointer-events: none; }

        /* ==========================================================================
           [SYSTEM LAYER 2] TOP HUD (HEADER) & BLE SYNC BADGE
           ========================================================================== */
        .hud-top {
            position: sticky; top: 0; width: 100%; height: 85px; padding: 0 45px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.1));
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-bottom: 1px solid var(--border-dim); z-index: 1000;
        }
        
        .brand { display: flex; align-items: center; gap: 16px; cursor: default;}
        .brand-icon { width: 26px; height: 26px; background: var(--primary); border-radius: 6px; transform: rotate(45deg); box-shadow: 0 0 15px var(--primary); animation: pulseBrand 3s infinite cubic-bezier(0.4, 0, 0.2, 1);}
        @keyframes pulseBrand { 0%, 100% { transform: rotate(45deg) scale(1); opacity: 1; } 50% { transform: rotate(225deg) scale(1.1); opacity: 0.8; } }
        .brand-text { font-size: 22px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .brand-text span { font-weight: 400; color: var(--text-muted); font-size: 14px; letter-spacing: 1px;}

        .ble-badge {
            padding: 10px 24px; border-radius: 100px; font-size: 12px; font-weight: 800; letter-spacing: 1.5px;
            display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: uppercase;
            background: rgba(255,255,255,0.06); border: 1px solid var(--border-dim); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .ble-badge:active { transform: scale(0.95); }
        .ble-badge.connected { background: rgba(50, 215, 75, 0.1); border-color: var(--led-on); color: var(--led-on); }
        .indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--led-off); transition: 0.3s; }
        .ble-badge.connected .indicator { background: var(--led-on); box-shadow: 0 0 12px var(--led-on); animation: pulseDot 2s infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

        /* ==========================================================================
           [SYSTEM LAYER 3] BOTTOM NAVIGATION (iOS TAB BAR)
           ========================================================================== */
        .tab-bar {
            position: fixed; bottom: 0; width: 100%; height: 95px;
            background: rgba(10, 12, 14, 0.95); backdrop-filter: blur(45px); -webkit-backdrop-filter: blur(45px);
            display: flex; justify-content: center; gap: 90px; align-items: center; padding-bottom: 25px;
            border-top: 1px solid var(--border-dim); z-index: 1000;
        }
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; color: var(--text-muted); font-size: 11px; font-weight: 800; letter-spacing: 1px; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tab-icon { width: 26px; height: 26px; fill: var(--text-muted); transition: 0.4s; }
        .tab-item:hover { color: var(--text-dim); }
        .tab-item.active { color: var(--primary); transform: translateY(-6px); }
        .tab-item.active .tab-icon { fill: var(--primary); filter: drop-shadow(0 0 12px var(--primary)); }

        /* ==========================================================================
           [SYSTEM LAYER 4] WORKSPACE & ENTERPRISE TELEMETRY STRIP
           ========================================================================== */
        .workspace { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
        .workspace::-webkit-scrollbar { display: none; }
        .page { display: none; width: 100%; min-height: 100%; padding: 35px 45px 160px 45px; opacity: 0; transform: translateY(20px); animation: pageIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .page.active { display: block; }
        @keyframes pageIn { to { opacity: 1; transform: translateY(0); } }

        .panel { background: var(--bg-panel); backdrop-filter: blur(40px); border: 1px solid var(--border-dim); border-radius: var(--radius-xl); padding: 35px; margin-bottom: 35px; box-shadow: var(--shadow-float); }

        /* 高階無指針純數字遙測列 */
        .telemetry-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 35px; }
        .t-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); padding: 30px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); transition: 0.3s; }
        .t-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--border-dim); transition: 0.3s;}
        .t-card.highlight::before { background: var(--primary); box-shadow: 0 0 20px var(--primary); }
        .t-card.danger::before { background: var(--led-alert); box-shadow: 0 0 20px var(--led-alert); }
        
        .t-label { font-size: 13px; font-weight: 900; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase;}
        .t-val-box { display: flex; align-items: baseline; gap: 10px;}
        .t-val { font-family: var(--font-data); font-size: 60px; font-weight: 900; color: var(--text-main); text-shadow: 0 0 25px rgba(255,255,255,0.2); transition: 0.3s;}
        .t-card.highlight .t-val { color: var(--primary); text-shadow: 0 0 35px var(--border-focus); }
        .t-card.danger .t-val { color: var(--led-alert); text-shadow: 0 0 35px rgba(255,59,48,0.5); }
        .t-unit { font-size: 20px; font-weight: 800; color: var(--text-muted); }

        /* ==========================================================================
           [SYSTEM LAYER 5] MASTER SWITCH (主電源滑塊)
           ========================================================================== */
        .master-box { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,0.5); padding: 28px 35px; border-radius: var(--radius-lg); 
            border: 1px solid var(--border-dim); margin-bottom: 45px; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); cursor: pointer; transition: 0.4s;
        }
        .master-info h3 { font-size: 18px; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; color: var(--text-main); transition: 0.3s;}
        .master-info p { font-size: 13px; color: var(--text-muted); font-weight: 600; line-height: 1.4; transition: 0.3s;}
        
        .sw-track { width: 96px; height: 48px; background: #050505; border: 2px solid var(--border-dim); border-radius: 24px; position: relative; transition: 0.3s; box-shadow: inset 0 6px 15px rgba(0,0,0,0.9); }
        .sw-thumb { width: 40px; height: 40px; background: linear-gradient(145deg, #48484a, #1c1c1e); border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.4s cubic-bezier(0.3, 1.5, 0.4, 1); display: flex; align-items:/* 接續你原本的 CSS */
        .sw-thumb { 
            width: 40px; height: 40px; 
            background: linear-gradient(145deg, #48484a, #1c1c1e); 
            border-radius: 50%; position: absolute; top: 2px; left: 2px; 
            transition: 0.4s cubic-bezier(0.3, 1.5, 0.4, 1); 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .master-box.active .sw-track { background: var(--primary); border-color: var(--accent); box-shadow: 0 0 20px rgba(50, 215, 75, 0.4); }
        .master-box.active .sw-thumb { left: 50px; background: white; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <header class="hud-top">
        <div class="brand">
            <div class="brand-icon"></div>
            <div class="brand-text">AETHER <span>ENTERPRISE</span></div>
        </div>
        <div id="connect-btn" class="ble-badge">
            <div class="indicator"></div>
            <span id="ble-status">OFFLINE</span>
        </div>
    </header>

    <main class="workspace">
        <div id="dashboard" class="page active">
            <div class="telemetry-strip">
                <div class="t-card highlight">
                    <div class="t-label">核心溫度</div>
                    <div class="t-val-box"><span id="val-temp" class="t-val">0.0</span><span class="t-unit">°C</span></div>
                </div>
                <div class="t-card">
                    <div class="t-label">即時功率</div>
                    <div class="t-val-box"><span id="val-pwr" class="t-val">0</span><span class="t-unit">W</span></div>
                </div>
                <div class="t-card">
                    <div class="t-label">累計電費</div>
                    <div class="t-val-box"><span id="val-cost" class="t-val">0.0</span><span class="t-unit">$</span></div>
                </div>
            </div>

            <div class="panel">
                <div id="master-switch" class="master-box">
                    <div class="master-info">
                        <h3>系統總電源</h3>
                        <p id="system-desc">安全檢查通過，準備就緒</p>
                    </div>
                    <div class="sw-track"><div class="sw-thumb"></div></div>
                </div>
                
                <div style="display: flex; gap: 15px; align-items: center;">
                    <span style="font-weight: 800; color: var(--text-muted);">預約關閉 (分):</span>
                    <input type="number" id="timer-min" value="1" style="background: #000; border: 1px solid var(--border-dim); color: white; padding: 10px; border-radius: 8px; width: 80px;">
                    <button onclick="sendTimer()" style="background: var(--primary); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer;">傳送指令</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let bleDevice;
        let bleChar;

        // 1. Web Bluetooth 連線邏輯
        async function connectBLE() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Smart_Plug' }],
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb'] // 依照你的藍牙模組修改
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                bleChar = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                
                document.getElementById('connect-btn').classList.add('connected');
                document.getElementById('ble-status').innerText = 'CONNECTED';
                
                // 開始監聽回傳數據
                bleChar.startNotifications();
                bleChar.addEventListener('characteristicvaluechanged', handleData);
            } catch (err) { console.error("BLE Error:", err); }
        }

        // 2. 處理 ESP32 回傳的數據字串 "Temp,Power,Cost"
        function handleData(event) {
            let data = new TextDecoder().decode(event.target.value);
            let vals = data.split(',');
            if(vals.length >= 3) {
                document.getElementById('val-temp').innerText = vals[0];
                document.getElementById('val-pwr').innerText = vals[1];
                document.getElementById('val-cost').innerText = vals[2];
            }
        }

        // 3. 核心功能：計算秒數並傳送
        function sendTimer() {
            let minutes = document.getElementById('timer-min').value;
            let seconds = minutes * 60;
            let command = "S" + seconds + "\n"; // 格式如 S1800
            
            if (bleChar) {
                bleChar.writeValue(new TextEncoder().encode(command));
                alert("已成功發送 " + seconds + " 秒倒數指令！");
            } else {
                alert("請先連線藍牙！");
            }
        }

        document.getElementById('connect-btn').addEventListener('click', connectBLE);
        
        // 切換開關動畫
        document.getElementById('master-switch').addEventListener('click', function() {
            this.classList.toggle('active');
            let cmd = this.classList.contains('active') ? "ON\n" : "OFF\n";
            if(bleChar) bleChar.writeValue(new TextEncoder().encode(cmd));
        });
    </script>
</body>
</html>
