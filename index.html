<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Enterprise | Precision Matrix & Safety</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #32d74b; --primary-rgb: 50, 215, 75;
            --bg-base: #010204; --bg-panel: rgba(14, 16, 20, 0.85);
            --led-on: #32d74b; --led-alert: #ff3b30; --led-off: #3a3a3c;
            --text-main: #ffffff; --text-muted: #8e8e93;
            --border-dim: rgba(255, 255, 255, 0.08);
            --radius-xl: 32px; --radius-lg: 20px;
            --font-ui: "Inter", sans-serif; --font-data: "JetBrains Mono", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-ui); background: var(--bg-base); color: var(--text-main); width: 100vw; height: 100vh; overflow-x: hidden; }
        
        /* 背景矩陣 */
        #matrix-canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.3; pointer-events: none; }

        /* 頂部狀態列 */
        .hud-top {
            position: sticky; top: 0; width: 100%; height: 80px; padding: 0 30px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-dim); z-index: 1000;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 20px; height: 20px; background: var(--primary); transform: rotate(45deg); box-shadow: 0 0 15px var(--primary); }
        .brand-text { font-size: 18px; font-weight: 900; letter-spacing: 2px; }

        .ble-badge {
            padding: 8px 16px; border-radius: 100px; font-size: 12px; font-weight: 800;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-dim); transition: 0.3s;
        }
        .ble-badge.connected { color: var(--led-on); border-color: var(--led-on); background: rgba(50, 215, 75, 0.1); }
        .indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--led-off); }
        .ble-badge.connected .indicator { background: var(--led-on); box-shadow: 0 0 10px var(--led-on); }

        /* 主工作區 */
        .workspace { padding: 25px; max-width: 800px; margin: 0 auto; }
        .telemetry-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .t-card { background: var(--bg-panel); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); padding: 20px; }
        .t-label { font-size: 11px; font-weight: 900; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 8px; }
        .t-val { font-family: var(--font-data); font-size: 32px; font-weight: 800; }
        .t-unit { font-size: 14px; color: var(--text-muted); margin-left: 5px; }

        /* 控制面板 */
        .panel { background: var(--bg-panel); border-radius: var(--radius-xl); padding: 25px; border: 1px solid var(--border-dim); margin-bottom: 20px; }
        .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .status-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: var(--led-off); transition: 0.3s; font-weight: 900;}
        .status-tag.active { background: var(--led-on); color: #000; box-shadow: 0 0 10px var(--led-on); }

        .timer-box { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-top: 10px;}
        input[type="number"] { background: #000; border: 1px solid var(--border-dim); color: #fff; padding: 8px; width: 70px; border-radius: 6px; font-family: var(--font-data); text-align: center; }
        .btn-send { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-send:active { transform: scale(0.95); }

        .reset-btn { width: 100%; padding: 18px; background: transparent; border: 1px solid var(--led-alert); color: var(--led-alert); border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 20px; letter-spacing: 2px;}
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <header class="hud-top">
        <div class="brand"><div class="brand-icon"></div><div class="brand-text">AETHER <span>ENTERPRISE</span></div></div>
        <div id="connect-btn" class="ble-badge"><div class="indicator"></div><span id="ble-status">OFFLINE</span></div>
    </header>

    <main class="workspace">
        <div class="telemetry-strip">
            <div class="t-card"><div class="t-label">核心溫度</div><div><span id="val-temp" class="t-val">--.-</span><span class="t-unit">°C</span></div></div>
            <div class="t-card"><div class="t-label">系統總負載</div><div><span id="val-total" class="t-val">0.00</span><span class="t-unit">A</span></div></div>
        </div>

        <div class="panel">
            <div class="node-header"><strong>NODE 01</strong> <span id="tag-1" class="status-tag">STANDBY</span></div>
            <div class="t-val" style="font-size: 24px;"><span id="val-a1">0.00</span><span class="t-unit">A</span></div>
            <div class="timer-box">
                <input type="number" id="time-1" value="1" min="1">
                <span style="font-size: 12px; color: var(--text-muted);">MIN 斷電</span>
                <button class="btn-send" onclick="sendTimer(1)">啟動</button>
            </div>
        </div>

        <div class="panel">
            <div class="node-header"><strong>NODE 02</strong> <span id="tag-2" class="status-tag">STANDBY</span></div>
            <div class="t-val" style="font-size: 24px;"><span id="val-a2">0.00</span><span class="t-unit">A</span></div>
            <div class="timer-box">
                <input type="number" id="time-2" value="1" min="1">
                <span style="font-size: 12px; color: var(--text-muted);">MIN 斷電</span>
                <button class="btn-send" onclick="sendTimer(2)">啟動</button>
            </div>
        </div>

        <button class="reset-btn" onclick="sendReset()">SYSTEM MASTER RESET</button>
    </main>

    <script>
        let bleChar;

        async function connectBLE() {
            try {
                console.log("正在請求藍牙裝置...");
                const device = await navigator.bluetooth.requestDevice({
                    // 這裡修改：同時接受所有裝置或是依名稱搜尋
                    filters: [{ namePrefix: 'Smart_Plug_V2' }],
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });

                console.log("裝置已選取，正在連線 GATT...");
                const server = await device.gatt.connect();
                
                console.log("連線服務中...");
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                
                console.log("取得特徵值...");
                bleChar = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                
                document.getElementById('connect-btn').classList.add('connected');
                document.getElementById('ble-status').innerText = 'ONLINE';

                // 開始監聽數據
                await bleChar.startNotifications();
                bleChar.addEventListener('characteristicvaluechanged', handleData);
                console.log("藍牙通訊已就緒！");

            } catch (err) { 
                console.error(err);
                alert("連線失敗：" + err.message + "\n請確保使用的是 Chrome (Android/PC) 或 Bluefy (iOS)"); 
            }
        }

        function handleData(event) {
            let raw = new TextDecoder().decode(event.target.value);
            // 格式範例: T:25.5 | P1:0.00A P2:0.00A
            
            // 1. 解析溫度
            if(raw.includes('T:')) {
                let t = raw.split('T:')[1].split('|')[0].trim();
                document.getElementById('val-temp').innerText = t;
            }

            // 2. 解析 P1 電流
            if(raw.includes('P1:')) {
                let p1 = raw.split('P1:')[1].split('A')[0].trim();
                document.getElementById('val-a1').innerText = p1;
                updateNodeUI(1, p1);
            }

            // 3. 解析 P2 電流
            if(raw.includes('P2:')) {
                let p2 = raw.split('P2:')[1].split('A')[0].trim();
                document.getElementById('val-a2').innerText = p2;
                updateNodeUI(2, p2);
            }

            // 計算總電流
            let a1 = parseFloat(document.getElementById('val-a1').innerText) || 0;
            let a2 = parseFloat(document.getElementById('val-a2').innerText) || 0;
            document.getElementById('val-total').innerText = (a1 + a2).toFixed(2);
        }

        function updateNodeUI(id, amp) {
            let tag = document.getElementById('tag-' + id);
            if(parseFloat(amp) > 0.05) {
                tag.innerText = "POWERING";
                tag.classList.add('active');
            } else {
                tag.innerText = "STANDBY";
                tag.classList.remove('active');
            }
        }

        function sendTimer(id) {
            if(!bleChar) return alert("請先連線藍牙");
            let mins = document.getElementById('time-' + id).value;
            let secs = mins * 60;
            let cmd = `S${id},${secs}\n`;
            let encoder = new TextEncoder();
            bleChar.writeValue(encoder.encode(cmd));
            alert(`已發送：插座 ${id} 定時 ${mins} 分鐘`);
        }

        function sendReset() {
            if(!bleChar) return alert("請先連線藍牙");
            bleChar.writeValue(new TextEncoder().encode("RESET\n"));
            alert("系統重置指令已發送");
        }

        document.getElementById('connect-btn').addEventListener('click', connectBLE);

        // 背景動畫
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const columns = Math.floor(canvas.width / 20);
        const drops = Array(columns).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#32d74b"; ctx.font = "15px monospace";
            drops.forEach((y, i) => {
                const text = Math.floor(Math.random() * 2);
                ctx.fillText(text, i * 20, y * 20);
                if(y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
